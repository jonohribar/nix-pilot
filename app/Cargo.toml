[package]
name = "nix-pilot-app"
version = "0.1.0"
edition = "2021"
description = "nix-pilot desktop client: Settings, Software Store, Updates (Rust + GTK4 + libadwaita)"

[dependencies]
gtk4 = "0.9"
libadwaita = "0.7"
glib = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
which = "6"
log = "0.4"
env_logger = "0.11"
libc = "0.2"
